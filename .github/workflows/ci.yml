name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (regulations, syntax, share, shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regulation accuracy check
        run: node tools/check_regs.js
      - name: App + share validation
        run: node tools/check.js
